.info{flex:1;min-width:0;max-width:520px;overflow-wrap:break-word;text-align:right;transition:opacity .2s}

.info h2{text-wrap:balance;font-family:'Barlow Condensed',Impact,sans-serif;font-size:clamp(44px,7vw,84px);line-height:1;text-transform:uppercase;color:#e6e6e6;margin-bottom:18px}

.titlebox{position:absolute;left:calc(50% + 4vw);top:50%;transform:translateY(-50%);background:none;font:700 clamp(48px,7vw,96px)/1 'Barlow Condensed',Impact,sans-serif;text-transform:uppercase;color:#e6e6e6}

function rrPoints(w,h,r){
 const sx=w-2*r,sy=h-2*r,a=Math.PI*r/2,S=[
  [sx,u=>[-sx/2+u*sx,h/2]],[a,u=>{const t=Math.PI/2-u*Math.PI/2;return[sx/2+r*Math.cos(t),sy/2+r*Math.sin(t)]}],
  [sy,u=>[w/2,sy/2-u*sy]],[a,u=>{const t=-u*Math.PI/2;return[sx/2+r*Math.cos(t),-sy/2+r*Math.sin(t)]}],
  [sx,u=>[sx/2-u*sx,-h/2]],[a,u=>{const t=-Math.PI/2-u*Math.PI/2;return[-sx/2+r*Math.cos(t),-sy/2+r*Math.sin(t)]}],
  [sy,u=>[-w/2,-sy/2+u*sy]],[a,u=>{const t=Math.PI-u*Math.PI/2;return[-sx/2+r*Math.cos(t),sy/2+r*Math.sin(t)]}]];
 const L=S.reduce((s,q)=>s+q[0],0),n=Math.floor(L/11),out=[];
 for(let i=0;i<n;i++){let dd=((i+Math.random()-.5)/n*L+L)%L;for(const q of S){if(dd<=q[0]){out.push(q[1](dd/q[0]));break}dd-=q[0]}}

}

 const tx=(b.h||b.p||b.list)?`<div class="bt">${b.h?`<h3>${nw(b.h)}</h3>`:''}${(b.p||[]).map(t=>`<p>${nw(t)}</p>`).join('')}${b.list?`<ul>${b.list.map(t=>`<li>${t}</li>`).join('')}</ul>`:''}</div>`:'';
 const md=b.cols?`<div class="gc">${b.cols.map(c=>`<div style="flex:${c[0].w} 1 0">${c.map(x=>`<img src="${x.img}" alt="">`).join('')}</div>`).join('')}</div>`:b.rows?`<div class="gr">${b.rows.map(r=>`<div class="gx" style="width:${(r.frac*100).toFixed(1)}%">${r.cells.map(c=>`<img src="${c.img}" style="flex:${(c.w/c.h).toFixed(3)} 1 0;aspect-ratio:${c.w}/${c.h}" onload="this.style.flex=(this.naturalWidth/this.naturalHeight)+' 1 0';this.style.aspectRatio=this.naturalWidth+'/'+this.naturalHeight" alt="">`).join('')}</div>`).join('')}</div>`:b.img?`<img class="bi" src="${b.img}" alt="">`:'';
 if(md&&b.split)return `<div class="bs${b.flip?' flip':''}">${md}${tx}</div>`;
